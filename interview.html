<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>면접 준비 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f8f9fb; --text:#161a22; --sub:#667085; --faint:#98a2b3; --line:#e6e8ec;
  --primary:#2f6bff; --primary-h:#1f57e6; --primary-weak:#ebf1ff;
  --danger:#e5484d; --danger-weak:#ffeeee; --ok:#0e9f58; --ok-weak:#e5f7ed; --warn:#b26a00; --warn-weak:#fff4d9;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06); --shadow-lg:0 20px 48px rgba(16,24,40,.18);
  --r:14px; --r-sm:10px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1014; --surface:#171a20; --surface2:#1d2129; --text:#eceef2; --sub:#9aa4b5; --faint:#6b7585; --line:#2a2f3a;
  --primary:#5b8cff; --primary-h:#7aa2ff; --primary-weak:#1c2a4d;
  --danger:#ff6b6f; --danger-weak:#3a1d20; --ok:#3ecf8e; --ok-weak:#143024; --warn:#f0b34a; --warn-weak:#3a2c12;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 20px 48px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* 공통 부품 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;transition:background .12s,border-color .12s}
a.btn{text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{height:48px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus,.q textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
.field input:disabled{background:var(--surface2);color:var(--sub);cursor:not-allowed}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:5px}
.field small{display:block;color:var(--faint);font-size:12.5px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.chip.blue{background:var(--primary-weak);color:var(--primary);border-color:transparent}
.chip.green{background:var(--ok-weak);color:var(--ok);border-color:transparent}
.chip.red{background:var(--danger-weak);color:var(--danger);border-color:transparent}
.chip.amber{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.muted{color:var(--sub)} .small{font-size:13px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.progress{display:block;width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.banner{background:var(--warn-weak);color:var(--warn);border-radius:var(--r-sm);padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.banner code{font-family:inherit;font-weight:700;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:5px}
.err{color:var(--danger);font-size:13.5px;min-height:1.5em;margin:4px 0}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:600px){
  .grid3,.grid2,.checks{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .srow{grid-template-columns:1fr 1fr 1fr 30px;margin-bottom:12px}
  .srow>[data-s=label]{grid-column:1/4;grid-row:1}
  .srow>button{grid-column:4;grid-row:1}
  .srow>[data-s=date]{grid-column:1;grid-row:2}
  .srow>[data-s=end]{grid-column:2;grid-row:2}
  .srow>[data-s=time]{grid-column:3/5;grid-row:2}
  .srow.head,.rrow.head{display:none}
  .qrow .top{grid-template-columns:1fr 1fr}
  .rrow{grid-template-columns:1fr 56px 30px;margin-bottom:12px}
  .rrow>[data-k=elements]{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.progress>i{transition:none}}

/* 상단바 */
.nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .in{max-width:1360px;margin:0 auto;height:58px;padding:0 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;font-size:14px}
.nav .sp{margin-left:auto;display:flex;align-items:center;gap:8px}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 100px}
.wrap.wide{max-width:1360px}

/* 로그인 */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .box{width:100%;max-width:400px}
.auth .card{padding:28px}
.auth h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:14px 0 6px}
.auth .lead{color:var(--sub);margin-bottom:22px}
.auth .links{display:flex;justify-content:center;gap:16px;margin-top:18px;font-size:13px}
.auth .links a{color:var(--sub);text-decoration:none}
.auth .links a:hover{color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.tiles a{display:grid;place-items:center;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--text);font-weight:700;font-size:16px}
.tiles a:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}

/* 학생: 학교 고르기 */
.hello{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.3;margin-bottom:4px}
.gpa{display:flex;gap:20px;align-items:center;padding:16px 20px;margin-top:18px}
.gpa b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:var(--primary);white-space:nowrap}
.gpa p{border-left:1px solid var(--line);padding-left:20px}
.schools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:20px}
.school{text-align:left;padding:18px;display:flex;flex-direction:column;gap:4px;min-height:150px;transition:transform .12s,border-color .12s}
.school:hover{border-color:var(--primary);transform:translateY(-2px)}
.school .nm{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.school .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.school .bot{margin-top:auto;padding-top:12px}
.school .bot .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:5px}

/* 학생: 작성 */
.work{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.toc{position:sticky;top:78px;font-size:13.5px;max-height:calc(100vh - 100px);overflow:auto}
.toc h4{font-size:12px;color:var(--faint);font-weight:700;margin:14px 0 4px}
.toc a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:7px;color:var(--sub);text-decoration:none;line-height:1.35}
.toc a:hover{background:var(--surface);color:var(--text)}
.toc a i{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--faint)}
.toc a.done i{background:var(--ok);border-color:var(--ok)}
.toc a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info ul{margin:0;padding-left:18px}.info li{margin-bottom:6px}
.info .tip{list-style:none;margin-left:-18px;padding:10px 12px;background:var(--surface2);border-radius:10px;margin-bottom:6px;display:flex;gap:10px}
.info .tip b{flex:none;color:var(--primary);font-variant-numeric:tabular-nums}
.rubric{width:100%;border-collapse:collapse}
.rubric th,.rubric td{border-top:1px solid var(--line);padding:10px 4px;text-align:left;vertical-align:top}
.rubric tr:first-child>*{border-top:0}
.rubric th{width:10em;font-weight:700}
.rubric .pt{width:4em;text-align:right;font-weight:800;color:var(--primary);white-space:nowrap}
.area-h{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:32px 0 4px}
.area-d{color:var(--sub);font-size:13.5px;margin-bottom:12px}
.q{padding:18px;margin-bottom:12px;scroll-margin-top:76px}
.q .qt{font-weight:700;font-size:16px;line-height:1.5;margin:8px 0}
.q .hint{font-size:13.5px;color:var(--sub);background:var(--surface2);border-radius:8px;padding:8px 11px;margin-bottom:10px}
.q textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;resize:vertical;line-height:1.75;background:var(--surface);font-size:15.5px}
.q .cnt{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sub);margin-top:6px}
.q .cnt .over{color:var(--danger);font-weight:700}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .in{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
.dock .state{margin-right:auto;font-size:13px;color:var(--sub)}

/* 첨삭 */
.sheet{font-size:15.5px;line-height:2;white-space:pre-wrap;word-break:break-word;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface2);min-height:60px}
.sheet.rev{background:var(--surface)}
.sheet del{background:var(--danger-weak);color:var(--danger);text-decoration:line-through;border-radius:3px;padding:1px 0}
.sheet ins{background:var(--primary-weak);color:var(--primary);text-decoration:none;font-weight:600;border-radius:3px;padding:1px 2px;border-bottom:1.5px solid var(--primary)}
.sheet .n{font-size:10.5px;font-weight:800;color:#fff;background:var(--primary);border:0;border-radius:5px;padding:0 5px;height:16px;line-height:16px;display:inline-block;vertical-align:7px;margin:0 2px}
.sheet .n.on{box-shadow:0 0 0 3px var(--warn-weak);background:var(--warn)}
.sheet.clean ins{background:none;color:inherit;font-weight:inherit;border:0;padding:0}
.sheet.empty{color:var(--faint);display:grid;place-items:center;text-align:center;border-style:dashed}
.reasons{list-style:none;margin:12px 0 0;padding:0}
.reasons li{display:flex;gap:10px;padding:8px 10px;border-radius:10px;align-items:flex-start}
.reasons li.on{background:var(--warn-weak)}
.reasons .no{flex:none;min-width:20px;height:20px;display:grid;place-items:center;border-radius:6px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;margin-top:2px}
.reasons .body{flex:1;min-width:0}
.reasons .chg{color:var(--sub);font-size:12.5px;display:block}
.reasons input{width:100%;border:1px solid transparent;border-radius:7px;padding:3px 6px;margin-left:-6px;background:transparent}
.reasons input:hover{border-color:var(--line)}
.reasons input:focus{outline:0;border-color:var(--primary);background:var(--surface)}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fb>div{background:var(--surface2);border-radius:10px;padding:12px 14px}
.fb .full{grid-column:1/-1}
.fb h4{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.fb ul{margin:0;padding-left:16px}
.fb li .btn{margin-left:6px;vertical-align:1px}
.tnote{border-left:3px solid var(--primary);padding:14px 18px;white-space:pre-wrap}
.tnote h4{font-size:12px;color:var(--primary);font-weight:700;margin-bottom:2px}

/* 담임 */
.tgrid{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:78px;max-height:calc(100vh - 98px);display:flex;flex-direction:column;overflow:hidden}
.side .hd{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.side .list{overflow:auto;padding:6px}
.stu{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px}
.stu:hover{background:var(--surface2)}
.stu.on{background:var(--primary-weak)}
.stu .a{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:650}
.stu .b{font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu.off .a>span:first-child{color:var(--faint);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:12.5px;color:var(--sub)}
.thead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.thead h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.thead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair h4{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;gap:6px;min-height:30px}
.pair h4 .r{margin-left:auto;display:flex;gap:2px}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qhead .qt{flex:1;margin:0}
.q.blank{display:flex;align-items:center;gap:8px;padding:10px 16px;margin-bottom:8px;background:var(--surface2);box-shadow:none}
.q.blank .qt{flex:1;margin:0;font-size:14.5px;font-weight:600;color:var(--sub)}
.empty{padding:64px 20px;text-align:center;color:var(--sub);border-style:dashed;box-shadow:none}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;cursor:pointer}
.toggle input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--primary)}
.toggle input:checked::after{transform:translateX(16px)}

/* 질문 관리 */
.bank{display:grid;grid-template-columns:264px minmax(0,1fr);gap:20px;align-items:start}
.bank .menu button>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bank .menu .chip{flex:none}
.bank .menu{position:sticky;top:78px;padding:6px}
.bank .menu button{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:600}
.bank .menu button:hover{background:var(--surface2)}
.bank .menu button.on{background:var(--primary-weak);color:var(--primary)}
.bank .menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.sec{margin-bottom:12px}
.span2{grid-column:span 2}
#bankForm .pad{padding:14px 16px}
#bankForm .field{margin-bottom:8px}
#bankForm .grid3 .field{margin-bottom:0}
#bankForm .grid3{margin-bottom:8px}
#bankForm .sec{margin-bottom:10px}
#bankForm .field>span{margin-bottom:2px;font-size:12.5px;line-height:1.4}
#bankForm .field input,#bankForm .field select,#bankForm .field textarea,#bankForm .input{padding:6px 10px;font-size:14px}
#bankForm .field textarea{line-height:1.55}
#bankForm .field small{margin-top:2px}
#bankForm .grid3{gap:8px 10px}
#bankForm .sec>h3{margin-bottom:8px}
.sec>h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec>h3 .btn{margin-left:auto}
.rrow{display:grid;grid-template-columns:minmax(120px,1fr) 60px 2fr 30px;gap:6px;margin-bottom:6px;align-items:center}
.rrow.head{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
.rrow.head span{padding-left:2px}
.rrow .input{min-width:0}
.qrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.qrow .top{display:grid;grid-template-columns:1.2fr 90px 1.2fr auto;gap:8px;margin-bottom:8px}
.qrow .ops{display:flex;gap:2px}
.qrow textarea{min-height:44px;resize:vertical}
.qrow .input{margin-bottom:8px}
.qrow .input:last-child{margin-bottom:0}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.savebar{position:sticky;bottom:12px;display:flex;gap:8px;align-items:center;padding:10px 12px;margin-top:16px;box-shadow:var(--shadow-lg)}
.savebar .muted{margin-right:auto}

/* 관리자 */
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--sub);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{max-height:560px;overflow:auto;border-radius:var(--r)}

.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.timeline>div{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.timeline>div.past{opacity:.5}
.timeline>div.next{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
.timeline b{display:block;font-size:13.5px}
.timeline .dd{float:right;font-weight:800;color:var(--primary)}
.srow{display:grid;grid-template-columns:minmax(110px,1.3fr) 138px 138px minmax(84px,.8fr) 30px;gap:6px;margin-bottom:6px;align-items:center}
.srow .input{padding:6px 9px;min-width:0;font-size:14px}
.srow.head{margin-bottom:2px;font-size:12px;font-weight:700;color:var(--sub)}
.srow.head span{padding-left:2px}
.schblock{border-top:1px solid var(--line);padding:16px 0}
.schblock:first-of-type{border-top:0}
.schblock h4{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.found{border:1px solid var(--primary);border-radius:14px;padding:16px;margin-top:12px;background:var(--primary-weak)}
.found .input{background:var(--surface)}
.urls .u{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.urls .u:first-of-type{border-top:0}
.urls .u b{flex:none;width:76px;font-size:14px}

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="interview-questions.js"></script>
<script>
"use strict";
/* =====================================================================
   기본 도구
   ===================================================================== */
const BASE = window.INTERVIEW;
let D = BASE, CFG = { schools: {}, common: null };
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const app = $("#app");
const LOGO = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>`;
const mem = {};
const store = (kind) => ({
  get(k) { try { return window[kind].getItem(k); } catch { return mem[kind + k] ?? null; } },
  set(k, v) { try { window[kind].setItem(k, v); } catch { mem[kind + k] = v; } },
  del(k) { try { window[kind].removeItem(k); } catch { delete mem[kind + k]; } }
});
const LS = store("localStorage"), SS = store("sessionStorage");
const getJ = (st, k) => { try { return JSON.parse(st.get(k) || "null"); } catch { return null; } };
const schoolById = (id) => (VD || D).schools.find((s) => s.id === id);
const countChars = (t) => (t || "").replace(/\s/g, "").length;
const fmtSec = (sec) => (sec < 60 ? `약 ${sec}초` : `약 ${Math.floor(sec / 60)}분${sec % 60 ? " " + (sec % 60) + "초" : ""}`);
const fmtTime = (iso) => { if (!iso) return ""; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const lines = (t) => String(t || "").split("\n").map((x) => x.trim()).filter(Boolean);
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

// 브라우저 탭 이름을 화면마다 다르게, 아이콘은 메모 쓰는 연필(📝)
function setTab(suffix) {
  document.title = "면접 준비 노트" + (suffix || "");
  let l = document.querySelector('link[rel="icon"]'); if (!l) { l = document.createElement("link"); l.rel = "icon"; document.head.appendChild(l); }
  l.href = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📝</text></svg>`);
}
function toast(msg) {
  $$(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function modal(html, wide) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener("mousedown", (e) => { if (e.target === m) m.remove(); });
  document.body.appendChild(m); const f = $("input,textarea,select,button", m); if (f) f.focus();
  return m;
}
// 서버에 다녀오는 동안 버튼에 '저장하는 중'을 보여 준다
function busy(btn, label = "저장하는 중") { if (!btn) return; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label}`; }
function onSubmit(sel, fn) {
  const el = $(sel), errEl = $(".err", el);
  const run = () => {
    const empty = $$("[required]", el).find((i) => !i.value.trim());
    if (empty) { if (errEl) errEl.textContent = "빈칸을 채워 주세요."; return empty.focus(); }
    const vals = {}; $$("[name]", el).forEach((i) => (vals[i.name] = i.value));
    busy($("button.primary", el), "확인하는 중"); fn({ get: (n) => vals[n] });
  };
  $("button.primary", el).onclick = run;
  el.onkeydown = (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); run(); } };
}
function ask(title, desc, okLabel = "확인", danger) {
  return new Promise((res) => {
    const m = modal(`<h2>${esc(title)}</h2><p class="desc">${esc(desc)}</p><div class="acts"><button class="btn" data-x="0">취소</button><button class="btn ${danger ? "danger" : "primary"}" data-x="1">${esc(okLabel)}</button></div>`);
    m.addEventListener("click", (e) => { const b = e.target.closest("[data-x]"); if (b) { m.remove(); res(b.dataset.x === "1"); } });
  });
}

/* ---------- 질문 데이터: 기본 파일 + 담임이 고친 내용 ---------- */
// 겹치는 순서: 기본 파일 → 학년 공통(관리자) → 반별(담임). 일정과 요강 기록은 언제나 학년 공통을 따른다.
const SHARED_FIELDS = ["schedule", "date", "dateNote", "yogang"];
function mergeData(layer) {
  const d = clone(BASE), com = CFG.schools || {}, cl = (layer && layer.schools) || {};
  const ids = BASE.schools.map((s) => s.id);
  [...Object.keys(com), ...Object.keys(cl)].forEach((id) => { if (!ids.includes(id)) ids.push(id); });
  d.schools = ids.map((id) => {
    const base = BASE.schools.find((x) => x.id === id), below = com[id] || base; let sc = cl[id] ? { ...cl[id] } : { ...below };
    if (cl[id] && below) SHARED_FIELDS.forEach((f) => { if (below[f] !== undefined) sc[f] = below[f]; else delete sc[f]; });
    sc.id = id; ["depts", "format", "rubric", "tips", "questions", "common"].forEach((k) => (sc[k] = sc[k] || []));
    return sc;
  }).sort((x, y) => (x.custom ? 1 : 0) - (y.custom ? 1 : 0));
  const c = (layer && layer.common) || CFG.common;
  if (c) { d.common = c.common || d.common; d.commonTips = c.commonTips || d.commonTips; }
  return d;
}
let VD = null; const DCACHE = {};
function buildData() { D = mergeData(CFG.cls); VD = null; Object.keys(DCACHE).forEach((k) => delete DCACHE[k]); }
// 관리자가 학년 전체를 볼 때는 학생의 반에 맞는 질문으로 바꿔 본다
function dataFor(cls) { if (!CFG.classes) return D; return (DCACHE[cls] = DCACHE[cls] || mergeData(CFG.classes[cls])); }
function questionsFor(school, dept, extra) {
  const own = school.questions.filter((q) => !q.dept || !dept || q.dept === dept);
  const common = (school.common || []).map((id) => (VD || D).common.find((c) => c.id === id)).filter(Boolean);
  const ex = (extra || []).map((q) => ({ ...q, area: "선생님이 따로 낸 질문", kind: "추가" }));
  return ex.concat(own, common);
}
function groupByArea(qs) {
  const order = [], map = {};
  qs.forEach((q) => { if (!map[q.area]) { map[q.area] = []; order.push(q.area); } map[q.area].push(q); });
  return order.map((a) => ({ area: a, items: map[a] }));
}

/* =====================================================================
   저장소: 서버(Netlify 함수) 또는 미리보기(이 브라우저)
   ===================================================================== */
const NEED_SERVER = 9; // 이 화면이 필요로 하는 서버 파일(interview.mjs) 번호
const API = {
  mode: "server", stale: false,
  async probe() {
    if (window.IV_FORCE_DEMO || location.protocol === "file:") { this.mode = "demo"; }
    else {
      try {
        const r = await fetch("/api/interview", { method: "POST", headers: { "content-type": "application/json" }, body: '{"action":"getData"}' });
        if (!(r.headers.get("content-type") || "").includes("json")) this.mode = "demo";
      } catch { this.mode = "demo"; }
    }
    try { CFG = (await this.call("getData", {})).cfg || CFG; } catch {}
    buildData();
  },
  async call(action, payload) {
    if (this.mode === "demo") return demo(action, payload);
    let r;
    try { r = await fetch("/api/interview", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action, ...payload }) }); }
    catch { throw new Error("인터넷 연결을 확인하고 다시 시도하세요."); }
    let j; try { j = await r.json(); } catch { throw new Error("서버 응답을 읽지 못했습니다. 잠시 뒤 다시 시도하세요."); }
    if (j.ok || typeof j.v === "number") this.stale = (j.v || 0) < NEED_SERVER;
    if (!j.ok) throw new Error(j.message || "요청을 처리하지 못했습니다.");
    return j;
  }
};
const DEMO_HINT = { student: "<code>1반 1번</code> 첫 비밀번호 <code>110101</code> (처음 로그인 체험), <code>1반 2번</code> 비밀번호 <code>1234</code> (첨삭 받은 학생)", teacher: "담임 이름 <code>김담임</code> 비밀번호 <code>1234</code> (1반 담임. 다른 반은 관리자 화면에서 만든 뒤)", admin: "관리자 코드 <code>admin</code>" };
const demoBanner = (who) => API.mode !== "demo" ? (API.stale && /^#(admin|teacher)/.test(ROUTE) ? `<div class="banner" style="background:var(--danger-weak);color:var(--danger)"><b>서버 파일이 예전 것입니다.</b> 저장이 제대로 되지 않을 수 있습니다. GitHub 저장소의 <code>netlify/functions/interview.mjs</code>를 최신 파일로 바꿔 올린 뒤 새로 고침해 주세요.</div>` : "") :
  `<div class="banner"><b>미리보기 모드</b> 저장 서버 없이 이 브라우저 안에서만 동작합니다. ${who ? "체험용 계정: " + DEMO_HINT[who] : ""}</div>`;

function demoSeed() {
  const ans = "저는 그냥 과학을 좋아해서 이차전지과에 지원했습니다. 이차전지과에서는 배터리를 만드는 방법을 배운다고 알고 있습니다. 입학하면 열씸히 공부하겠습니다. 그리고 취업이 잘된다고 들었습니다.";
  return {
    roster: { "1-1": { name: "김하늘", birth: "110101" }, "1-2": { name: "이준서", birth: "110202" }, "1-3": { name: "박서연", birth: "110303" }, "1-4": { name: "최민준", birth: "110404" }, "2-1": { name: "정유나", birth: "110505" } },
    s: { "1-2": { cls: 1, num: 2, name: "이준서", pin: "1234", school: "energy", dept: "이차전지과", submitted: { energy: new Date().toISOString() },
      answers: { energy: { "en-2-1": ans, "en-1-3": "제가 존경하는 인물은 아버지입니다. 아버지는 20년 동안 한 회사에서 전기 설비 일을 하시면서 한 번도 지각을 하지 않으셨습니다. 저도 아버지처럼 맡은 일을 끝까지 책임지는 기술인이 되고 싶습니다.", "en-4-2": "룸메이트와 갈등이 생기면 먼저 대화를 하겠습니다." } } } },
    f: { "1-2": { note: {}, released: {}, extra: {}, items: { energy: { "en-2-1": { answer: ans, model: "예시 첨삭", at: new Date().toISOString(),
      edits: [
        { from: "저는 그냥 과학을 좋아해서", to: "저는 과학 시간에 전기 회로 실험을 하며 배터리에 관심이 생겨", reason: "'그냥'은 이유가 없다는 말로 들립니다. 관심이 생긴 계기를 먼저 말하세요. (실제 경험으로 바꿔 쓰기)" },
        { from: "열씸히", to: "열심히", reason: "맞춤법을 바로잡았습니다." },
        { from: " 그리고 취업이 잘된다고 들었습니다.", to: "", reason: "남에게 들은 이야기보다 내가 배우고 싶은 것으로 끝내는 편이 좋습니다." }],
      summary: "질문이 '무엇을 배우는지 아는가'인데 배우는 내용이 한 문장뿐입니다. 학과에서 배우는 과목이나 실습을 한두 개 더 말하면 학과 이해도 점수를 받을 수 있습니다.",
      strengths: ["짧고 분명한 문장으로 말했습니다."], improve: ["학교 홈페이지에서 이차전지과 교육과정을 찾아 과목 이름을 넣기", "태양전지과와 무엇이 다른지 한 문장 넣기"],
      followups: ["전기 회로 실험에서 무엇이 가장 기억에 남았나요?"] } } } } },
    gpa: { "1-1": { score: "243.5", note: "" }, "1-2": { score: "228", note: "" } },
    t: { "1": { name: "김담임", pass: "1234" } }, cfg: { schools: {}, common: null }
  };
}
function demo(action, p) {
  let db = getJ(LS, "iv-demo6"); if (!db) db = demoSeed();
  const save = () => LS.set("iv-demo6", JSON.stringify(db));
  const emptyFb = () => ({ items: {}, note: {}, released: {}, extra: {} });
  const pub = (s) => { const { pin, ...rest } = s; return { ...rest, hasPin: !!pin }; };
  const forStu = (fb) => { const o = emptyFb(); if (!fb) return o; o.extra = fb.extra || {}; Object.keys(fb.released || {}).forEach((k) => { if (fb.released[k]) { o.released[k] = true; o.items[k] = (fb.items || {})[k] || {}; o.note[k] = (fb.note || {})[k] || ""; } }); return o; };
  const fail = (m) => { throw new Error(m); };
  db.gpa = db.gpa || {};
  db.cfg.classes = db.cfg.classes || {};
  if (action === "getData") { const o = { schools: db.cfg.schools, common: db.cfg.common }; if (p.cls === "all") o.classes = db.cfg.classes; else if (Number(p.cls)) o.cls = db.cfg.classes[Number(p.cls)] || { schools: {}, common: null }; return { cfg: clone(o) }; }
  if (action === "rosterNames") { const names = {}; Object.keys(db.roster).forEach((k) => { const [c, n] = k.split("-").map(Number); if (c === Number(p.cls)) names[n] = db.roster[k].name; }); return { names }; }

  if (action.startsWith("student")) {
    const key = `${Number(p.cls)}-${Number(p.num)}`, r = db.roster[key]; let s = db.s[key];
    if (!r && !s) fail("명단에 없는 학생입니다. 반과 번호를 확인하거나 담임 선생님께 알려 주세요.");
    const byPin = !!(s && s.pin && s.pin === p.pin), byBirth = !!(!(s && s.pin) && r && r.birth === p.pin);
    if (!byPin && !byBirth) fail(s && s.pin ? "비밀번호가 맞지 않습니다. 잊었다면 담임 선생님께 초기화를 부탁하세요." : "처음에는 생년월일 6자리(예: 110305)를 넣으세요.");
    if (action === "studentLogin") return byBirth ? { mustChange: true, name: r.name } : { me: pub(s), feedback: forStu(db.f[key]), gpa: db.gpa[key] || null };
    if (action === "studentSetPin") {
      if (String(p.newPin).length < 4) fail("새 비밀번호는 4자 이상이어야 합니다.");
      if (r && r.birth === p.newPin) fail("생년월일과 다른 비밀번호를 만들어 주세요.");
      if (!s) s = db.s[key] = { cls: Number(p.cls), num: Number(p.num), name: r.name, answers: {}, submitted: {} };
      s.pin = p.newPin; save(); return {};
    }
    Object.assign(s, { school: p.school, dept: p.dept, customSchool: p.customSchool, answers: p.answers, updatedAt: new Date().toISOString() });
    if (p.submitSchool) s.submitted[p.submitSchool] = new Date().toISOString();
    save(); return { me: pub(s) };
  }
  if (action.startsWith("admin")) {
    if (p.code !== "admin") fail("관리자 코드가 맞지 않습니다.");
    if (action === "adminGet") {
      const keys = [...new Set([...Object.keys(db.roster), ...Object.keys(db.s)])];

function placeEdits(orig, edits) {
  const placed = [], lost = []; let cursor = 0;
  (edits || []).forEach((e, i) => {
    if (!e || !e.from) { if (e) lost.push({ ...e, i }); return; }
    let idx = -1;
    if (Number.isInteger(e.at) && orig.substr(e.at, e.from.length) === e.from) idx = e.at;
    if (idx < 0) idx = orig.indexOf(e.from, cursor);
    if (idx < 0) idx = orig.indexOf(e.from);
    if (idx >= 0 && placed.some((p) => idx < p.end && idx + e.from.length > p.start)) idx = -1;
    if (idx < 0) lost.push({ ...e, i });
    else { placed.push({ ...e, i, start: idx, end: idx + e.from.length }); cursor = Math.max(cursor, idx + e.from.length); }
  });
  placed.sort((a, b) => a.start - b.start).forEach((p, n) => (p.no = n + 1));
  return { placed, lost };
}
function tighten(from, to) {
  let a = 0; while (a < from.length && a < to.length && from[a] === to[a]) a++;
  let b = 0; while (b < from.length - a && b < to.length - a && from[from.length - 1 - b] === to[to.length - 1 - b]) b++;
  return { pre: from.slice(0, a), del: from.slice(a, from.length - b), ins: to.slice(a, to.length - b), post: b ? from.slice(from.length - b) : "" };
}

  const { placed } = placeEdits(orig, edits); let html = "", pos = 0;
  placed.forEach((p) => {
    html += esc(orig.slice(pos, p.start)); const t = tighten(p.from, p.to || "");
    html += clean ? esc(p.to || "") : esc(t.pre) + (t.del ? `<del>${esc(t.del)}</del>` : "") + (t.ins ? `<ins>${esc(t.ins)}</ins>` : "") + `<button class="n" data-act="mark" data-no="${p.no}" title="고친 이유 보기">${p.no}</button>` + esc(t.post);
    pos = p.end;
  });
  return html + esc(orig.slice(pos));
}
function revisedText(orig, edits) {
  const { placed } = placeEdits(orig, edits); let out = "", pos = 0;
  placed.forEach((p) => { out += orig.slice(pos, p.start) + (p.to || ""); pos = p.end; });

}
/* 담임이 수정본을 직접 고치면 원문과 비교해 첨삭 표시를 다시 만든다 */
function diffEdits(orig, rev, old) {
  const tok = (s) => s.match(/\s+|[^\s]+/g) || [];

  const hunks = []; let i = 0, j = 0, pos = 0, cur = null;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { cur = null; pos += a[i].length; i++; j++; continue; }
    if (!cur) { cur = { at: pos, from: "", to: "" }; hunks.push(cur); }
    if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { cur.to += b[j]; j++; } else { cur.from += a[i]; pos += a[i].length; i++; }
  }
  const out = [];
  hunks.forEach((h) => {
    if (!h.from) { // 덧붙이기만 한 경우: 앞(또는 뒤) 낱말을 기준으로 삼는다

      if (s < h.at) { const ctx = orig.slice(s, h.at); h = { at: s, from: ctx, to: ctx + h.to }; }

    }

}

async function aiFetch(url, opt) {
  const waits = [4000, 10000]; // 붐빌 때는 4초, 10초 쉬고 두 번까지 다시 시도
  for (let i = 0; ; i++) {
    let r; try { r = await fetch(url, opt); } catch { throw new Error("AI 서비스에 연결하지 못했습니다. 인터넷 연결이나 학교 방화벽을 확인하세요."); }
    const j = await r.json().catch(() => ({}));
    if (r.ok) return j;
    if ([429, 500, 502, 503, 529].includes(r.status) && i < waits.length) { await new Promise((res) => setTimeout(res, waits[i])); continue; }
    if ([503, 529].includes(r.status)) { const e = new Error(`AI 서비스에 지금 사용자가 몰려 답을 받지 못했습니다(${r.status}). 고장이 아니니 1~2분 뒤 다시 눌러 주세요. 계속 그러면 AI 설정에서 다른 모델로 바꾸거나 예비 모델을 정해 두세요.`); e.busy = true; throw e; }
    if (r.status === 429) throw new Error("AI 사용 한도를 넘었습니다(429). 잠시 뒤 다시 하거나, 무료 키라면 유료로 바꾸거나 다른 모델을 골라 주세요.");
    const em = String((j.error && (j.error.message || j.error)) || "");
    if (r.status === 404) { const rec = (em.match(/use (?:models\/)?([\w.\-]+) for/) || [])[1]; throw new Error(`이 모델은 지금 쓸 수 없습니다(404). ${rec ? `AI 서비스가 '${rec}' 모델을 쓰라고 안내합니다. ` : ""}'목록 불러오기'를 눌러 목록에 있는 모델로 바꿔 주세요.`); }
    throw new Error(`AI 오류 (${r.status}) ${em || "키와 모델 이름을 확인하세요."}`);
  }
}

async function aiChat(c, system, user, file) {
  try { const out = await aiChatOnce(c, system, user, file); c.used = c.model; return out; }
  catch (e) {
    if (!e.busy || !c.fallback || c.fallback === c.model) throw e;
    let out; try { out = await aiChatOnce({ ...c, model: c.fallback }, system, user, file); } catch (e2) { throw e2.busy ? e : new Error(`'${c.model}' 모델이 붐벼서 예비 모델 '${c.fallback}'로 시도했지만 실패했습니다. ${e2.message}`); }
    c.used = c.fallback; return out;
  }
}
async function aiChatOnce(c, system, user, file) {
  const isPdf = file && file.mime === "application/pdf";

    const parts = (file ? [{ inlineData: { mimeType: file.mime, data: file.b64 } }] : []).concat([{ text: user }]);
    const j = await aiFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:generateContent`, { method: "POST", headers: { "x-goog-api-key": c.key, "content-type": "application/json" },

    const url = file ? `data:${file.mime};base64,${file.b64}` : "";

    const j = await aiFetch("https://api.openai.com/v1/chat/completions", { method: "POST", headers: { authorization: "Bearer " + c.key, "content-type": "application/json" },
      body: JSON.stringify({ model: c.model, messages: [{ role: "system", content: system }, { role: "user", content }], response_format: { type: "json_object" } }) });
    return j.choices?.[0]?.message?.content || "";
  }
  const content = file ? [{ type: isPdf ? "document" : "image", source: { type: "base64", media_type: file.mime, data: file.b64 } }, { type: "text", text: user }] : user;

  return (j.content || []).map((b) => (b.type === "text" ? b.text : "")).join("");
}
const AI_SYSTEM = `당신은 중학교 3학년 학생의 고등학교 입학 면접 답변을 첨삭하는 진로·진학 지도 교사입니다.
학생이 쓴 답변 원문을 받아, 원문 위에 빨간 펜으로 고치듯이 '고칠 구절'과 '고친 구절'과 '이유'를 돌려줍니다.

첨삭 원칙
1. 학생이 쓴 사실과 경험을 바꾸거나 새로 지어내지 않는다. 경험이나 근거가 부족하면 문장을 지어내지 말고 improve에 "어떤 내용을 더 넣으면 좋은지"를 적는다.
2. 중학생이 면접장에서 실제로 말할 수 있는 자연스러운 말투('~습니다')를 지킨다. 어른스러운 과장, 미사여구, 어려운 한자어로 바꾸지 않는다. 학생의 목소리가 남아 있어야 한다.
3. 면접은 말로 하는 것이다. 결론을 먼저 말하게 하고, 긴 문장은 나누고, 같은 말의 반복과 "음, 그냥, 약간, 뭔가" 같은 군말은 뺀다.
4. 맞춤법, 띄어쓰기, 비문, 질문과 어긋난 답, 학교·학과와 이어지지 않는 부분, 제시된 채점 요소에 비추어 부족한 부분을 고친다.
5. 꼭 필요한 곳만 고친다. 보통 3~8곳. 이미 좋은 문장은 그대로 둔다.
6. 제시된 '알맞은 길이'보다 많이 길면 덜어낼 부분을 고치고, 많이 짧으면 improve에 채울 내용을 적는다.

edits 작성 규칙 (매우 중요)
- "from"은 학생 원문에 있는 글자를 띄어쓰기와 문장부호까지 그대로 옮긴 연속된 구절이어야 한다. 한 글자라도 다르면 안 된다.
- from 구절끼리 겹치지 않게 하고, 원문에 나오는 순서대로 적는다.
- from은 원문에서 한 번만 나오도록 충분히 길게 잡되, 한 문장을 넘기지 않는다.
- 삭제는 "to"를 ""로 한다.
- 새 문장을 덧붙일 때는 바로 앞 구절을 from으로 잡고, to에 그 구절과 덧붙일 문장을 함께 적는다.
- "reason"은 학생이 읽고 이해할 수 있게 한 문장으로, 친절하지만 분명하게 쓴다.

반드시 아래 JSON 한 개만 출력한다. 설명, 머리말, 코드 표시를 붙이지 않는다.
{"edits":[{"from":"","to":"","reason":""}],"summary":"총평 2~3문장","strengths":["잘한 점"],"improve":["더 채우면 좋은 점"],"followups":["이 답을 들은 면접관이 이어서 물을 만한 질문 1~2개"]}`;

생각하는 순서

질문은 면접관이 실제로 말하는 것처럼 '~해 보세요', '~인가요?' 말투로 쓴다. 기출인 것처럼 꾸미지 않는다.

  if (!r.rows.length) return toast("읽을 수 있는 학생이 없습니다. 양식의 첫 줄(반, 번호, 이름, 생년월일, 가내신)을 지우지 말고 올려 주세요.");
  const desc = `${r.rows.length}명을 읽었습니다. 새 학생 ${r.added}명, 정보 고침 ${r.updated}명, 가내신만 바꿈 ${r.gpaOnly}명.${r.bad.length ? ` 읽지 못한 줄 ${r.bad.length}개 (예: ${r.bad[0].slice(0, 24)}).` : ""} 파일에 없는 학생과 빈칸은 그대로 둡니다.`;
  if (!(await ask("엑셀 올리기", desc, "명단에 반영"))) return;
  try { await API.call("adminSaveRoster", { code: A.code, rows: r.rows }); await loadAdmin(); renderAdmin(); toast("명단에 반영했습니다."); } catch (er) { toast(er.message); }
}

  if (act === "addFollow") return extraModal(row, b.dataset.text);
  if (act === "dropExtra") { row.feedback.extra[T.tab] = row.feedback.extra[T.tab].filter((q) => q.id !== b.dataset.id); await saveFeedback(row); return refreshMain(); }
  if (act === "onlyDone") { T.onlyDone = !!b.dataset.v; return refreshMain(); }
  if (act === "toggleClean") { T.clean[qid] = !T.clean[qid]; return refreshMain(); }
  if (act === "copy") { const it = itemOf(row, qid); try { await navigator.clipboard.writeText(revisedText(it.answer, it.edits)); toast("수정본을 복사했습니다."); } catch { toast("복사하지 못했습니다."); } return; }
  if (act === "manual") return manualModal(row, qid);
  if (act === "editSummary") return summaryModal(row, qid);
  if (act === "dropEdit") { itemOf(row, qid).edits.splice(Number(b.dataset.i), 1); await saveFeedback(row); return refreshMain(); }
  if (act === "dropItem") { if (!(await ask("첨삭 지우기", "이 질문의 첨삭을 모두 지웁니다.", "지우기", true))) return; delete row.feedback.items[T.tab][qid]; await saveFeedback(row); return renderTeacher(); }
  if (act === "aiOne") {
    if (!aiCfg()) return aiSettingsModal();
    T.busy[qid] = true; refreshMain();
    try { await reviewOne(row, T.tab, qid); await saveFeedback(row); } catch (er) { toast(er.message); }
    delete T.busy[qid]; return renderTeacher();
  }
  if (act === "aiAll") {
    if (!aiCfg()) return aiSettingsModal();
    const sid = T.tab, ans = row.student.answers[sid], items = row.feedback.items[sid] || {};
    const todo = studentQs(row, sid).filter((q) => ans[q.id] && (!items[q.id] || items[q.id].answer !== ans[q.id]));
    T.busy.all = true; let fail = 0;
    for (const q of todo) { T.busy[q.id] = true; refreshMain(); try { await reviewOne(row, sid, q.id); } catch (er) { fail++; toast(er.message); if (fail >= 2) break; } delete T.busy[q.id]; }
    T.busy = {}; await saveFeedback(row); renderTeacher(); toast(fail ? `${todo.length - fail}개를 첨삭했고 나머지는 하지 못했습니다.` : `${todo.length}개 첨삭을 마쳤습니다.`);
  }
});

/* ---------- 주소에 따라 화면 고르기 ---------- */
let ROUTE = window.IV_START !== undefined ? window.IV_START : location.hash;
function go(h) {
  ROUTE = h === "#" ? "" : h;
  if (!window.IV_FORCE_DEMO) { try { if (location.hash !== ROUTE) location.hash = ROUTE; } catch {} }
  route(); window.scrollTo(0, 0);
}
function route() {
  $$(".modal").forEach((m) => m.remove());
  const h = ROUTE;
  if (h === "#admin") return renderAdmin();
  if (/^#teacher/.test(h)) {
    const cls = h === "#teacher-all" ? "all" : "mine";
    if (T.auth && (T.auth.cls === "all") === (cls === "all")) return renderTeacher();
    const saved = getJ(SS, tKey(cls));
    if (saved) { app.innerHTML = `<div class="auth"><span class="muted">불러오는 중</span></div>`; return teacherEnter(saved).catch((e) => { SS.del(tKey(cls)); teacherLoginView(cls, e.message); }); }
    T.auth = null; return teacherLoginView(cls);
  }
  renderStudent();
}
document.addEventListener("click", (e) => {
  const a = e.target.closest('a[href^="#"]'); if (!a || a.dataset.act) return;
  e.preventDefault(); go(a.getAttribute("href"));
});
window.addEventListener("hashchange", () => { if (!window.IV_FORCE_DEMO && location.hash !== ROUTE) { ROUTE = location.hash; route(); } });
API.probe().then(route);
</script>
