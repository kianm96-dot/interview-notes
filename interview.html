<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>안내</title>
<script>
/* ============================================================
   여기 한 줄만 고치면 됩니다: 새 통합 사이트 주소 (끝에 / 없이)
   ============================================================ */
const NEW_SITE = "https://hilarious-pithivier-62dd0e.netlify.app";
</script>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#161a22;--sub:#667085;--line:#e6e8ec;--primary:#2f6bff}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1014;--card:#171a20;--text:#eceef2;--sub:#9aa4b5;--line:#2a2f3a;--primary:#5b8cff}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 28px;text-align:center;box-shadow:0 1px 3px rgba(16,24,40,.08)}
  .icon{font-size:40px;line-height:1;margin-bottom:14px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
  p{margin:0;color:var(--sub);font-size:15px}
  .time{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);color:var(--text);font-weight:700;white-space:pre-wrap}
  a.btn{display:block;margin-top:20px;height:50px;line-height:50px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
  .url{margin-top:10px;font-size:13px;color:var(--sub);overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card" id="box"><div class="icon">🔧</div><h1>지금은 사이트 점검 중입니다</h1><p>잠시 뒤 다시 들어와 주세요.</p></div>
<script>
// 관리자가 통합 사이트의 '설정과 자료 > 기존 사이트 안내'에서 정한 내용을 읽어 와 보여 준다.
// 읽어 오지 못하면 위의 '점검 중' 안내가 그대로 보인다.
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function show(n) {
  const box = document.getElementById("box"), url = n.url || NEW_SITE;
  if (n.mode === "moved") {
    document.title = "사이트가 개편되었습니다";
    box.innerHTML = `<div class="icon">📝</div><h1>사이트가 개편되었습니다</h1><p>고입 희망 조사와 면접 준비 노트가 하나로 합쳐졌습니다. 아래 주소로 이동해 주세요. 쓰던 비밀번호는 그대로 쓸 수 있습니다.</p>${n.text ? `<div class="time">${esc(n.text)}</div>` : ""}
      <a class="btn" href="${esc(url)}">새 사이트로 이동하기</a><div class="url">${esc(url)}</div>`;
  } else {
    document.title = "사이트 점검 중";
    box.innerHTML = `<div class="icon">🔧</div><h1>지금은 사이트 점검 중입니다</h1><p>더 편하게 쓸 수 있도록 사이트를 고치고 있습니다. 점검이 끝나면 다시 들어와 주세요.</p>${n.text ? `<div class="time">${esc(n.text)}</div>` : ""}`;
  }
}
async function load() {
  try {
    const r = await fetch(NEW_SITE + "/api", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "notice" }) });
    const j = await r.json(); if (j.ok && j.notice) show(j.notice);
  } catch {}
}
load(); setInterval(load, 60000);   // 열어 둔 화면도 1분마다 새 안내로 바뀐다
</script>
</body>
</html>
